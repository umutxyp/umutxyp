<text x="34" y="168" font-family="'Segoe UI', Inter, 'Helvetica Neue', Ubuntu, Roboto, Arial, sans-serif" font-size="16.5" fill="#94a3b8">Real-time server list with live player counts,</text>
<text x="34" y="192" font-family="'Segoe UI', Inter, 'Helvetica Neue', Ubuntu, Roboto, Arial, sans-serif" font-size="16.5" fill="#94a3b8">uptime history, vote rankings &amp; 50K+ player</text>
<text x="34" y="216" font-family="'Segoe UI', Inter, 'Helvetica Neue', Ubuntu, Roboto, Arial, sans-serif" font-size="16.5" fill="#94a3b8">profiles. A signed-telemetry plugin feeds it.</text>
