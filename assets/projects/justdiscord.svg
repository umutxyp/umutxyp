<text x="34" y="168" font-family="'Segoe UI', Inter, 'Helvetica Neue', Ubuntu, Roboto, Arial, sans-serif" font-size="16.5" fill="#94a3b8">Scored listings with reviews that explain the</text>
<text x="34" y="192" font-family="'Segoe UI', Inter, 'Helvetica Neue', Ubuntu, Roboto, Arial, sans-serif" font-size="16.5" fill="#94a3b8">score, Discord-verified ownership, a huge free</text>
