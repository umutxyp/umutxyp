<svg xmlns="http://www.w3.org/2000/svg" width="600" height="366" viewBox="0 0 600 366" fill="none">
<style>.snake{stroke-dasharray:180 1736;animation:snake 7s linear infinite}
@keyframes snake{to{stroke-dashoffset:-1916}}
.eq{transform-box:fill-box;transform-origin:center bottom;animation:eq .8s ease-in-out infinite alternate}
@keyframes eq{0%{transform:scaleY(.25)}100%{transform:scaleY(1)}}
.float{animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-4px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 4s cubic-bezier(.6,0,.4,1) infinite}
@keyframes spin{0%,40%{transform:translate(0,-6px) rotate(0)}60%,100%{transform:translate(0,-6px) rotate(144deg)}}
.scanY{animation:sy 2.4s ease-in-out infinite}
@keyframes sy{0%{transform:translateY(0)}50%{transform:translateY(55px)}100%{transform:translateY(0)}}
.live{animation:live 1.4s ease-in-out infinite}
@keyframes live{50%{opacity:.25}}
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}</style>
<defs>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
  <radialGradient id="glow" cx="0.12" cy="0.1" r="0.8"><stop offset="0" stop-color="#818cf8" stop-opacity=".22"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
  <linearGradient id="run" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#818cf8" stop-opacity="0"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity=".12"/></pattern>
</defs>
<rect x="2" y="2" width="596" height="362" rx="22" fill="#0a0f1a"/>
<rect x="2" y="2" width="596" height="362" rx="22" fill="url(#dots)"/>
<rect x="2" y="2" width="596" height="362" rx="22" fill="url(#glow)"/>
<rect x="2" y="2" width="596" height="362" rx="22" stroke="#1e293b" stroke-width="2"/>
<rect x="2" y="2" width="596" height="362" rx="22" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" class="snake"/>
<g transform="translate(64 70)"><rect x="-34" y="-34" width="68" height="68" rx="18" fill="#818cf8" fill-opacity=".1" stroke="#818cf8" stroke-opacity=".35"/><path d="M-24 -18 Q-24 -24 -18 -24 H18 Q24 -24 24 -18 V6 Q24 12 18 12 H-4 L-14 22 V12 H-18 Q-24 12 -24 6 Z" fill="url(#ac)"/><path d="M0 -9 L2.6 -2.8 L9 -2.8 L3.8 1.2 L5.6 7.6 L0 3.8 L-5.6 7.6 L-3.8 1.2 L-9 -2.8 L-2.6 -2.8 Z" fill="#fff" transform="translate(0 -6)" class="spin"/></g>
<text x="118" y="66" font-family="'Segoe UI', Inter, 'Helvetica Neue', Ubuntu, Roboto, Arial, sans-serif" font-size="32" font-weight="800" fill="#f8fafc">JustDiscord</text>
<text x="118" y="94" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#818cf8">↗ justdiscord.org</text>
<g transform="translate(504 44)"><rect width="66" height="26" rx="13" fill="#052e16" stroke="#4ade80" stroke-opacity=".5"/><circle cx="16" cy="13" r="4" fill="#4ade80" class="live"/><text x="27" y="17.5" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#86efac" letter-spacing="1">LIVE</text></g>
