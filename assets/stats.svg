  <text x="144.0" y="70" text-anchor="middle" font-family="'Segoe UI', Inter, 'Helvetica Neue', Ubuntu, Roboto, Arial, sans-serif" font-size="40" font-weight="800" fill="#38bdf8">3M+</text>
  <text x="144.0" y="100" text-anchor="middle" font-family="'Segoe UI', Inter, 'Helvetica Neue', Ubuntu, Roboto, Arial, sans-serif" font-size="16" fill="#7b93ad">Beatra users</text>
</g>
