<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
<style>.up{opacity:0;animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.b1{animation:d1 16s ease-in-out infinite alternate}
.b2{animation:d2 20s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(240px,60px)}}
@keyframes d2{to{transform:translate(-260px,-50px)}}
.role{opacity:0;animation-name:role;animation-iteration-count:infinite;animation-fill-mode:backwards}
@keyframes role{0%{opacity:0;transform:translateY(10px)}6%,27%{opacity:1;transform:none}33%,100%{opacity:0;transform:translateY(-10px)}}</style>
<defs>
  <clipPath id="frame"><rect width="1200" height="320" rx="24"/></clipPath>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#38bdf8"/></pattern>
  <radialGradient id="fade" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="m"><rect width="1200" height="320" fill="url(#fade)"/></mask>
  <linearGradient id="name" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
    <stop offset="0" stop-color="#bae6fd"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#0284c7"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0;900 0" dur="5s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="320" fill="#07111f"/>
  <g filter="url(#blur)" opacity=".5">
    <circle class="b1" cx="300" cy="80" r="170" fill="#0284c7"/>
    <circle class="b2" cx="900" cy="260" r="190" fill="#1d4ed8"/>
  </g>
  <rect width="1200" height="320" fill="url(#dots)" mask="url(#m)"/>
  <text class="up" x="600.0" y="152" text-anchor="middle" font-family="'Segoe UI', Inter, 'Helvetica Neue', Ubuntu, Roboto, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="1" fill="url(#name)">Umut Bayraktar</text>
  <g class="up" style="animation-delay:.3s" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="22" fill="#bae6fd"><text class="role" x="600.0" y="214" text-anchor="middle" style="animation-delay:0s;animation-duration:9s">Full-Stack Developer</text><text class="role" x="600.0" y="214" text-anchor="middle" style="animation-delay:3s;animation-duration:9s">AI Systems Researcher</text><text class="role" x="600.0" y="214" text-anchor="middle" style="animation-delay:6s;animation-duration:9s">Building Beatra · MCStat · JustDiscord</text></g>
  <rect width="1200" height="320" rx="24" stroke="#14304f" stroke-width="2"/>
</g>
</svg>
