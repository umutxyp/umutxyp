<svg xmlns="http://www.w3.org/2000/svg" width="91" height="76" viewBox="0 0 91 76" fill="none"><style>.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:d 1s linear forwards}
