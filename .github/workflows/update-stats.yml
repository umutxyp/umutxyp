name: Update stats

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull live numbers from codeshare.me
        run: python3 scripts/fetch_stats.py

      - name: Rebuild cards
        run: python3 scripts/generate.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets
          git diff --cached --quiet || { git commit -m "Update stats from codeshare.me"; git push; }
